<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainly — Local-First Thinking Canvas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="top-bar">
        <div class="top-bar-left">
            <div class="logo">🧠</div>
            <span class="app-title">Brainly</span>
        </div>
        <div class="top-bar-center">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="global-search" placeholder="Search notes, links, folders, and PDFs..." autocomplete="off">
            </div>
        </div>
        <div class="top-bar-right">
            <button id="toolbar-new-folder-btn" class="toolbar-action-btn" title="Create New Folder Bubble">📁 + Folder</button>
            <button class="menu-btn" id="menu-toggle" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="canvas-workspace" id="canvas-workspace">
        
        <section class="my-links-container" id="my-links-anchor">
            <div class="my-links-header">
                <h3>🔗 My Links</h3>
                <div class="my-links-actions">
                    <button id="add-link-btn" title="Add External Link">＋ Link</button>
                    <label for="pdf-upload" class="pdf-upload-label" title="Upload Local PDF">
                        ＋ PDF
                        <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;">
                    </label>
                </div>
            </div>

            <div class="my-links-folders-grid" id="my-links-folders-grid"></div>

            <div class="my-links-shelf" id="my-links-shelf"></div>

            <div class="trash-bin-dropzone" id="trash-bin-dropzone">
                <span class="trash-icon">🗑️</span> Drop here to delete
            </div>
        </section>

    </main>

    <div class="fab-dock-cluster">
        <button id="fab-new-note" class="fab-trigger main-action" title="Create Blank Document Note">＋ Note</button>
        <button id="fab-voice-note" class="fab-trigger voice-action" title="Stream Hardware Voice Transcription">
            <span id="voice-label">Voice</span>
        </button>
        <button id="fab-ai-chat" class="fab-trigger ai-action" title="Toggle Brainly Conversational Companion">✨ AI</button>
    </div>

    <div id="canvas-context-menu" class="custom-context-menu hidden">
        <div class="context-menu-item" id="ctx-create-note">📝 Create New Note</div>
        <div class="context-menu-item" id="ctx-create-folder">📁 Create New Folder</div>
    </div>

    <div class="ai-chat-panel hidden" id="ai-chat-panel">
        <div class="ai-chat-panel-header">
            <div class="ai-branding-block">
                <span class="ai-spark-icon">✨</span>
                <h3>Brainly AI Companion</h3>
            </div>
            <div class="ai-chat-control-array">
                <button id="ai-voice-toggle-btn" class="ai-utility-action-btn" data-enabled="false" title="Toggle real-time audio playback">
                    <span class="voice-status-indicator-dot"></span>
                    <span id="ai-voice-btn-label">Voice: OFF</span>
                </button>
                <button id="ai-clear-history-btn" class="ai-utility-action-btn clear-danger-hover" title="Wipe current chat display history">
                    Clear Log
                </button>
                <button id="close-ai-btn" aria-label="Minimize AI panel">×</button>
            </div>
        </div>

        <div class="ai-chat-log" id="ai-chat-log">
            <div class="ai-message system">
                Hello! I am your sandboxed intelligence engine running locally. I can parse across all canvas notes, links, and documents. Ask me anything.
            </div>
        </div>
        <div class="ai-panel-input-zone">
            <input type="text" id="ai-user-query" placeholder="Ask about your ideas..." autocomplete="off">
            <button id="ai-submit-btn">➔</button>
        </div>
    </div>

    <div class="modal-backdrop-overlay hidden" id="generic-modal">
        <div class="modal-surface-card">
            <h3 id="modal-title">Prompt Title</h3>
            <div id="modal-body-content">
                </div>
            <div class="modal-footer-actions">
                <button id="modal-cancel-btn" class="modal-btn secondary">Cancel</button>
                <button id="modal-confirm-btn" class="modal-btn primary">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module" src="ai-core.js"></script>
    <script src="script.js"></script>
</body>
</html>
